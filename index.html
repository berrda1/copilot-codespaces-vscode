<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ data.student_name }}'s Profile</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <!-- Include Chart.js from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div class="container mt-5">
    <h2>{{ data.student_name }}'s Visual Profile</h2>
    <canvas id="profileChart" width="400" height="400"></canvas>
    <div class="mt-3">
        <a href="{{ url_for('index') }}" class="btn btn-secondary">Enter Another Profile</a>
    </div>
</div>

<script>
    // Prepare chart data
    const labels = {{ data.labels | tojson }};
    const scores = {{ data.scores | tojson }};

    const ctx = document.getElementById('profileChart').getContext('2d');
    const profileChart = new Chart(ctx, {
        type: 'radar', // Using a radar chart for multidimensional visualization
        data: {
            labels: labels,
            datasets: [{
                label: '{{ data.student_name }}',
                data: scores,
                backgroundColor: 'rgba(54, 162, 235, 0.2)',
                borderColor: 'rgba(54, 162, 235, 1)',
                pointBackgroundColor: 'rgba(54, 162, 235, 1)',
                pointBorderColor: '#fff',
                pointHoverBackgroundColor: '#fff',
                pointHoverBorderColor: 'rgba(54, 162, 235, 1)'
            }]
        },
        options: {
            scales: {
                r: {
                    suggestedMin: 0,
                    suggestedMax: 100
                }
            },
            plugins: {
                title: {
                    display: true,
                    text: '{{ data.student_name }}\'s Academic & Social-Emotional Profile'
                }
            }
        }
    });
</script>
</body>
</html>
